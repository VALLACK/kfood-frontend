name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # 기존 코드의 lint 경고를 정리하기 전까지는 결과만 보여주고 PR을 막지 않음
      - run: npm run lint
        continue-on-error: true
